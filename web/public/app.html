<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harley — Hesabım</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="topline"></div>

<header class="nav">
  <div class="brand"><span class="logo">H</span> Harley</div>
  <nav>
    <a class="nav-link" href="/">Anasayfa</a>
    <a class="nav-link" href="https://github.com/flewqiee/harley/releases/latest" target="_blank" rel="noreferrer">İndir</a>
    <a href="#" id="logout" class="btn ghost sm hidden">Çıkış</a>
  </nav>
</header>

<main class="auth-wrap">
  <div id="auth-box" class="panel hidden">
    <h2>Hesabına gir</h2>
    <p class="muted small">Premium yakında. Hesabını şimdiden oluştur.</p>
    <div class="tabs">
      <button id="tab-login" class="tab active">Giriş</button>
      <button id="tab-register" class="tab">Kayıt Ol</button>
    </div>
    <input id="email" class="field" type="email" placeholder="E-posta" autocomplete="email" />
    <input id="password" class="field" type="password" placeholder="Şifre (en az 8 karakter)" autocomplete="current-password" />
    <button id="submit" class="btn primary full" style="margin-top:8px">Giriş</button>
    <p id="auth-status" class="muted small"></p>
  </div>

  <div id="dash-box" class="panel hidden">
    <h2>Hesabım</h2>
    <p class="muted">Hoş geldin, <b id="dash-email"></b></p>
    <div class="divider"></div>
    <div id="license-area"></div>
    <div class="notice" style="margin-top:14px">
      <b>Premium çok yakında.</b>
      <p class="muted small" style="margin:6px 0 12px">Görsel analiz, belge analizi, ekran analizi ve altın tema üzerinde çalışıyoruz. Hazır olduğunda buradan yükseltebilirsin.</p>
      <a class="btn gold full" href="https://donate.bynogame.com/flewqiee" target="_blank" rel="noreferrer">Geliştirmeyi Destek Ol</a>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let mode = 'login';
function showAuth(){ $('auth-box').classList.remove('hidden'); $('dash-box').classList.add('hidden'); $('logout').classList.add('hidden'); }
function showDash(){ $('auth-box').classList.add('hidden'); $('dash-box').classList.remove('hidden'); $('logout').classList.remove('hidden'); }

$('tab-login').onclick = () => { mode='login'; $('tab-login').classList.add('active'); $('tab-register').classList.remove('active'); $('submit').textContent='Giriş'; };
$('tab-register').onclick = () => { mode='register'; $('tab-register').classList.add('active'); $('tab-login').classList.remove('active'); $('submit').textContent='Kayıt Ol'; };

async function api(url, body) {
  const r = await fetch(url, { method: body?'POST':'GET', headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined });
  return r.json().catch(()=>({ok:false,message:'Yanıt okunamadı'}));
}
$('submit').onclick = async () => {
  const email=$('email').value.trim(), password=$('password').value;
  $('auth-status').textContent='...';
  const r = await api(mode==='register'?'/api/register':'/api/login', { email, password });
  if (r.ok) loadMe(); else $('auth-status').textContent = r.message || 'Hata';
};
$('logout').onclick = async () => { await api('/api/logout', {}); showAuth(); };

function renderLicense(me) {
  const area = $('license-area');
  if (me.license) {
    area.innerHTML = '<span class="badge">PREMIUM AKTİF</span><div class="lic" style="margin-top:10px"><div class="muted small">Lisans anahtarın</div><textarea readonly id="lic-key">'+me.license+'</textarea><button class="btn full" id="copy-lic" style="margin-top:8px">Kopyala</button></div>';
    $('copy-lic').onclick = () => { const t=$('lic-key'); t.select(); document.execCommand('copy'); $('copy-lic').textContent='Kopyalandı ✓'; };
  } else {
    area.innerHTML = '<p class="muted">Henüz premium yok.</p>';
  }
}
async function loadMe() {
  const me = await api('/api/me');
  if (!me.ok) { showAuth(); return; }
  showDash();
  $('dash-email').textContent = me.email;
  renderLicense(me);
}
loadMe();
</script>
</body>
</html>
