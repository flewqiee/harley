# Fly.io dağıtımı — kalıcı disk (SQLite) ile. Kurulum: fly launch / fly deploy
app = "harleyai"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DB_PATH = "/data/data.sqlite"

[[mounts]]
  source = "harley_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
